name: Build and Release

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history & tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify CMake and CPack availability
        run: |
          cmake --version
          cpack --version
          go version

      - name: Configure Release (CMake Preset)
        run: cmake --preset release

      - name: Build Release Binary
        run: cmake --build --preset release

      - name: Run Unit & Version Tests (CTest)
        run: ctest --preset release --output-on-failure

      - name: Validate Default Configuration
        run: ./loupedeck-commander validate config/config.yaml

      - name: Package Linux Release (DEB & TGZ via CPack)
        run: cpack --preset release

      - name: Build & Package Windows amd64 Release (ZIP via CPack)
        run: |
          cmake --preset windows
          cmake --build --preset windows
          cpack --preset windows

      - name: Collect Release Artifacts & Checksums
        run: |
          mkdir -p dist
          cp build-RELEASE/*.deb dist/
          cp build-RELEASE/*.tar.gz dist/
          cp build-WINDOWS/*.zip dist/
          (cd dist && sha256sum * > SHA256SUMS)
          ls -lh dist/
          cat dist/SHA256SUMS

      - name: Upload Build Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: loupedeck-commander-packages
          path: dist/*
          if-no-files-found: error

      - name: Verify Tagged Commit Belongs to main or dev Branch
        id: tag_branch_check
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin "+refs/heads/*:refs/remotes/origin/*" --prune

          ON_MAIN="false"
          ON_DEV="false"

          if git show-ref --verify --quiet refs/remotes/origin/main && \
             git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            ON_MAIN="true"
          fi

          if git show-ref --verify --quiet refs/remotes/origin/dev && \
             git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/dev; then
            ON_DEV="true"
          fi

          echo "Tagged commit ${GITHUB_SHA} (${GITHUB_REF_NAME}): on_main=${ON_MAIN}, on_dev=${ON_DEV}"

          if [[ "${ON_MAIN}" != "true" && "${ON_DEV}" != "true" ]]; then
            echo "::notice::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on 'main' or 'dev' branch; skipping release."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Mark as prerelease when tagged from dev (and not yet merged to main) or when tag has a pre-release suffix
          IS_PRERELEASE="false"
          if [[ "${ON_MAIN}" != "true" && "${ON_DEV}" == "true" ]]; then
            IS_PRERELEASE="true"
          elif [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          TARGET_BRANCH="main"
          if [[ "${ON_MAIN}" != "true" ]]; then
            TARGET_BRANCH="dev"
          fi

          echo "should_release=true" >> "${GITHUB_OUTPUT}"
          echo "is_prerelease=${IS_PRERELEASE}" >> "${GITHUB_OUTPUT}"
          echo "target_branch=${TARGET_BRANCH}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.tag_branch_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }} (${{ steps.tag_branch_check.outputs.target_branch }})
          generate_release_notes: true
          prerelease: ${{ steps.tag_branch_check.outputs.is_prerelease == 'true' }}
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

